<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sample co-branded seller packet. Download does not create a file.">
  <title>VIP portal</title>
  <script src="brand.js"></script>
  <link rel="stylesheet" href="portal.css">
</head>
<body class="app" data-page="packets">
  <a class="skip" href="#main">Skip to content</a>
  <div class="topbar">
    <p class="sample-banner" role="note">Sample / demo data</p>
    <header class="site-header">
      <div class="header-inner">
        <div class="lockup">
          <a class="logo-link" href="listings.html">
            <img class="logo" alt="" width="112" height="52">
          </a>
          <span class="portal-word" data-fill="portalLabel">VIP portal</span>
        </div>
        <div class="header-tools">
          <a class="header-phone" data-fill="phone" data-href-kind="phone"></a>
          <a class="btn btn-small btn-ghost" href="index.html">Sign out</a>
        </div>
      </div>
    </header>
  </div>

  <div class="app-body">
    <nav id="sidebar" class="sidebar" aria-label="Portal"></nav>
    <div class="app-content">
      <main id="main" class="wrap" tabindex="-1">
        <h1 class="page-title">Seller Packets</h1>
        <p class="page-lead">A leave-behind for the listing appointment. Your brokerage mark sits beside the stager. The stager's name and phone stay on the page. Download does not create a file.</p>
        <div class="packet-layout block">
          <fieldset class="field">
            <legend>Packet type</legend>
            <div id="packet-types" class="choice-col"></div>
          </fieldset>
          <div>
            <div id="packet-preview"></div>
            <div class="pay-row">
              <button class="btn" id="download-packet" type="button">Download sample</button>
            </div>
            <p id="download-note" class="form-note" hidden></p>
          </div>
        </div>
        <noscript>
          <p class="card">This sample needs JavaScript to show the demo.</p>
        </noscript>
      </main>
      <footer class="site-footer">
        <p>
          <span data-fill="businessName"></span>
          · <a data-fill="phone" data-href-kind="phone"></a>
          · <a data-fill="email" data-href-kind="email"></a>
        </p>
        <p data-fill="tagline"></p>
        <p><a class="public-link" data-href-kind="public" href="../">Home</a></p>
      </footer>
    </div>
  </div>

  <button id="more-backdrop" class="sheet-backdrop" type="button" hidden aria-label="Close menu"></button>
  <div id="more-sheet" class="more-sheet" hidden role="navigation" aria-label="More portal sections"></div>
  <nav id="tabbar" class="tabbar" aria-label="Portal"></nav>

  <script src="sample-data.js"></script>
  <script src="portal.js"></script>
</body>
</html>
