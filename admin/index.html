<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Sample admin with demo data only. Not a real account.">
  <title>Admin</title>
  <script src="brand.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="login">
  <a class="skip" href="#main">Skip to content</a>
  <div class="topbar" id="topbar"></div>
  <main id="main" class="login-main" tabindex="-1">
    <div class="card form-card">
      <h1><i class="fa-solid fa-lock" aria-hidden="true"></i> Sign in</h1>
      <p class="tagline" data-fill="tagline"></p>
      <!-- Inputs have no name attributes, so a no-JS submit cannot put a password in the URL. -->
      <form id="login-form" action="dashboard.html" method="get" autocomplete="off" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="text" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="off">
        </div>
        <div class="stack">
          <button class="btn" type="submit">Sign in</button>
          <a class="btn btn-ghost" id="view-demo" href="dashboard.html">View demo</a>
        </div>
        <p class="hint">Any email and password will open the demo. Nothing is checked or saved.</p>
      </form>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="sample-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
